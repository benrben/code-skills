[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
exclude = ["^\\.agents/", "^\\.claude/"]

[tool.coverage.run]
branch = true
relative_files = true
parallel = true
patch = ["subprocess"]
omit = [".agents/*", ".claude/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.vulture]
min_confidence = 100
exclude = [".agents", ".claude"]
